          GLIMBOO_COMPAT_FILE_EOF
          cat > 'playwright.config.mjs' <<'GLIMBOO_COMPAT_FILE_EOF'
          import { defineConfig, devices } from '@playwright/test';
          import { resolve } from 'node:path';

          const target = new URL(process.env.COMPAT_BASE_URL || 'https://www.glimboo.com');
          if (!['https:', 'http:'].includes(target.protocol) || target.username || target.password) {
            throw new Error('COMPAT_BASE_URL 必须是没有账号密码的 HTTP(S) 地址');
          }
          const output = resolve(process.env.COMPAT_OUTPUT_DIR || '../../scratchpad/browser-compatibility');
          const suite = process.env.COMPAT_SUITE || 'purchase';
          if (!['purchase', 'pages', 'all'].includes(suite)) throw new Error('COMPAT_SUITE 必须为 purchase、pages 或 all');

          export default defineConfig({
            testDir: '.',
            testMatch: suite === 'all' ? '*.spec.mjs' : suite === 'pages' ? 'compatibility.spec.mjs' : 'purchase.spec.mjs',
            outputDir: resolve(output, 'results'),
            fullyParallel: false,
            workers: 1,
            retries: process.env.CI ? 1 : 0,
            timeout: 90_000,
            globalTimeout: 18 * 60_000,
            expect: { timeout: 15_000 },
            reporter: [
              ['list'],
              ['html', { outputFolder: resolve(output, 'report'), open: 'never' }],
              ['json', { outputFile: resolve(output, 'results.json') }],
            ],
            use: {
              baseURL: target.origin,
              locale: 'en-US',
              timezoneId: 'America/Los_Angeles',
              colorScheme: 'light',
              actionTimeout: 15_000,
              navigationTimeout: 45_000,
              screenshot: 'only-on-failure',
              trace: 'retain-on-failure',
              video: 'retain-on-failure',
            },
            projects: [
              { name: 'chrome', use: { ...devices['Desktop Chrome'], channel: 'chrome' } },
              { name: 'edge', use: { ...devices['Desktop Edge'], channel: 'msedge' } },
              { name: 'firefox', use: { ...devices['Desktop Firefox'] } },
              { name: 'webkit', use: { ...devices['Desktop Safari'] } },
              { name: 'mobile-chrome', use: { ...devices['Pixel 5'] } },
              { name: 'mobile-webkit', use: { ...devices['iPhone 13'] } },
            ],
          });
          GLIMBOO_COMPAT_FILE_EOF
          cat > 'compatibility.spec.mjs' <<'GLIMBOO_COMPAT_FILE_EOF'
          import { test as base, expect } from '@playwright/test';
          import { platform, arch } from 'node:os';
          import { PAGE_CASES } from './pages.mjs';

          const categoryPath = '/category/glim-series/3';

          const test = base.extend({
            diagnostics: [async ({ page, browser, browserName }, use, testInfo) => {
              const origin = new URL(testInfo.project.use.baseURL).origin;
              const report = {
                project: testInfo.project.name,
                browserName,
                browserVersion: browser.version(),
                os: platform(),
                architecture: arch(),
                viewport: page.viewportSize(),
                startedAt: new Date().toISOString(),
                testTitle: testInfo.title,
                annotations: testInfo.annotations,
                pageErrors: [],
                consoleErrors: [],
                serverErrors: [],
                resourceFailures: [],
              };
              page.on('pageerror', error => report.pageErrors.push(error.message));
              page.on('console', message => {
                if (message.type() === 'error') report.consoleErrors.push(message.text());
              });
              page.on('response', response => {
                if (response.url().startsWith(`${origin}/`) && response.status() >= 500) {
                  report.serverErrors.push({ url: response.url(), status: response.status() });
                }
              });
              page.on('requestfailed', request => {
                const reason = request.failure()?.errorText || '';
                if (request.url().startsWith(`${origin}/`) &&
                    ['script', 'stylesheet'].includes(request.resourceType()) &&
                    !/abort|cancel/i.test(reason)) {
                  report.resourceFailures.push({ url: request.url(), reason });
                }
              });
              await use(report);
              report.url = page.url();
              report.userAgent = await page.evaluate(() => navigator.userAgent).catch(() => null);
              await testInfo.attach('browser-diagnostics', {
                body: JSON.stringify(report, null, 2), contentType: 'application/json',
              });
              expect.soft(report.pageErrors, '页面不应出现未捕获的 JavaScript 异常').toEqual([]);
              expect.soft(report.serverErrors, '站内页面或接口不应返回 5xx').toEqual([]);
              expect.soft(report.resourceFailures, '站内脚本和样式应成功加载').toEqual([]);
            }, { auto: true }],
          });

          async function visit(page, path) {
            const response = await page.goto(path, { waitUntil: 'domcontentloaded' });
            expect(response, `页面 ${path} 应有 HTTP 响应`).not.toBeNull();
            expect(response.status(), `页面 ${path} 的 HTTP 状态`).toBeLessThan(400);
            await expect(page.locator('main')).toBeVisible();
            await expect(page.getByRole('button', { name: 'Open search', exact: true })).toBeVisible();
            await expect(page.getByRole('banner').getByRole('button', { name: 'Account', exact: true })).toBeEnabled();
            const cookieDialog = page.getByRole('dialog', { name: 'Cookie consent', exact: true });
            if (await cookieDialog.isVisible()) {
              await cookieDialog.getByRole('button', { name: 'Reject All', exact: true }).click();
              await expect(cookieDialog).toBeHidden();
            }
            await expect(page.locator('main')).not.toHaveText('');
          }

          async function audit(page, testInfo, label) {
            // 逐屏滚动以触发懒加载；动画按浏览器帧等待，不用固定秒数掩盖加载失败。
            const height = await page.evaluate(() => document.documentElement.scrollHeight);
            const step = page.viewportSize().height;
            const waitForVisibleImages = () => expect.poll(() => page.locator('main img').evaluateAll(images => images
              .filter(img => {
                const rect = img.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && rect.right > 0 && rect.left < innerWidth &&
                  rect.bottom > 0 && rect.top < innerHeight;
              }).every(img => img.complete)), { timeout: 20_000, message: '视口内的内容图片应完成加载' }).toBe(true);
            for (let y = 0; y < height; y += step) {
              await page.evaluate(y => window.scrollTo(0, y), y);
              await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
              await waitForVisibleImages();
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await waitForVisibleImages();

            const hero = page.getByRole('region', { name: 'Featured music lollipop collections', exact: true });
            if (await hero.count()) {
              for (const name of ['Puddle Puff', 'Cosmos Bear']) {
                await hero.getByRole('button', { name: `Show ${name}`, exact: true }).click();
                const slide = hero.locator('[aria-roledescription="slide"][aria-hidden="false"]');
                await expect(slide).toHaveAttribute('aria-label', new RegExp(name));
                await expect(slide).toHaveCSS('opacity', '1');
                await expect.poll(() => slide.locator('img').evaluate(img => img.complete && img.naturalWidth > 0), {
                  message: `${name} 轮播图应成功加载`,
                }).toBe(true);
                await slide.locator('img').evaluate(img => img.decode());
              }
              await page.evaluate(() => window.scrollTo(0, 0));
            }

            const layout = await page.evaluate(() => {
              const width = document.documentElement.clientWidth;
              return {
                viewportWidth: width,
                documentWidth: document.documentElement.scrollWidth,
                overflowCandidates: [...document.querySelectorAll('main *')].flatMap(el => {
                  const rect = el.getBoundingClientRect();
                  if (!rect.width || !rect.height || (rect.right <= width + 2 && rect.left >= -2)) return [];
                  return [{ tag: el.tagName, class: el.className, left: rect.left, right: rect.right }];
                }).slice(0, 15),
                brokenImages: [...document.querySelectorAll('main img')]
                  .filter(img => img.getBoundingClientRect().width > 0 &&
                    img.getBoundingClientRect().height > 0 && img.complete && img.naturalWidth === 0)
                  .map(img => ({ src: img.currentSrc || img.src, alt: img.alt })),
              };
            });
            await testInfo.attach(`${label}-layout`, {
              body: JSON.stringify(layout, null, 2), contentType: 'application/json',
            });
            await testInfo.attach(`${label}-screenshot`, {
              // 禁用动画会触发轮播的 animationend 并改变业务状态，因此保留真实动画。
              body: await page.screenshot({ fullPage: true, type: 'jpeg', quality: 75, scale: 'css', animations: 'allow' }),
              contentType: 'image/jpeg',
            });
            expect.soft(layout.documentWidth, `${label} 不应产生整页横向溢出，详见 layout 附件`)
              .toBeLessThanOrEqual(layout.viewportWidth + 2);
            expect.soft(layout.brokenImages, `${label} 的内容图片不应破图`).toEqual([]);
          }

          for (const { label, path, group } of PAGE_CASES) {
            test(`${label}：加载、布局和图片`, async ({ page }, testInfo) => {
              testInfo.annotations.push({ type: '页面路径', description: path }, { type: '页面分组', description: group });
              await visit(page, path);
              await audit(page, testInfo, label);
            });
          }

          test('商品详情：从真实分类链接进入', async ({ page }, testInfo) => {
            await visit(page, categoryPath);
            const product = page.locator('main a[href^="/product/"]').first();
            await expect(product).toBeVisible();
            const href = await product.getAttribute('href');
            await product.click();
            await expect(page).toHaveURL(new URL(href, testInfo.project.use.baseURL).href);
            await expect(page.locator('main h1')).toBeVisible();
            await audit(page, testInfo, '商品详情');
          });

          test('搜索：打开搜索框并使用回车搜索', async ({ page }, testInfo) => {
            await visit(page, '/');
            await page.getByRole('button', { name: 'Open search', exact: true }).click();
            const input = page.getByRole('searchbox', { name: 'Search products', exact: true });
            await expect(input).toBeVisible();
            await expect(input).toBeFocused();
            await input.fill('cosmos');
            await expect(input).toHaveValue('cosmos');
            await input.press('Enter');
            await expect(page).toHaveURL(/\/search\?q=cosmos/);
            await expect(page.locator('main a[href^="/product/"]').first()).toBeVisible();
            await audit(page, testInfo, '搜索结果');
          });

          test('排序：价格升序同步到 URL，刷新后保留', async ({ page }, testInfo) => {
            await visit(page, categoryPath);
            const sort = page.getByRole('button', { name: /^Sort/ });
            await sort.click();
            await page.getByRole('option', { name: 'Price Low to High', exact: true }).click();
            await expect(page).toHaveURL(/sort=price_asc/);
            await expect(sort).toContainText('Price Low to High');
            await page.reload({ waitUntil: 'domcontentloaded' });
            await expect(sort).toContainText('Price Low to High');
            await audit(page, testInfo, '排序后列表');
          });

          test('导航：移动菜单或桌面分类导航可操作', async ({ page }, testInfo) => {
            await visit(page, '/');
            const menu = page.getByRole('button', { name: 'Open menu', exact: true });
            if (testInfo.project.use.isMobile) {
              await expect(menu).toBeVisible();
              await menu.click();
              const dialog = page.getByRole('dialog', { name: 'Menu', exact: true });
              await expect(dialog).toBeVisible();
              await expect(dialog.getByRole('link').first()).toBeVisible();
              await page.getByRole('button', { name: 'Close menu', exact: true }).click();
              await expect(dialog).toBeHidden();
            } else {
              const nav = page.getByRole('navigation', { name: 'Primary', exact: true });
              await expect(nav).toBeVisible();
              await nav.getByRole('button', { name: /^shop$/i }).hover();
              await expect(nav.getByRole('tablist', { name: 'Shop categories', exact: true })).toBeVisible();
              await nav.locator('#desktop-category-products a[href]').first().click();
              await expect(page).toHaveURL(/\/(page|category|product)\//);
              await expect(page.locator('main')).toBeVisible();
              await expect(page.locator('main')).not.toHaveText('');
            }
            await audit(page, testInfo, '导航操作后');
          });

          test('账号入口：游客进入登录页且表单可见', async ({ page }, testInfo) => {
            await visit(page, '/');
            const account = page.getByRole('banner').getByRole('button', { name: 'Account', exact: true });
            await expect(account).toBeEnabled();
            await account.click();
            await expect(page).toHaveURL(/\/login/);
            await expect(page.locator('#login-email')).toBeVisible();
            await audit(page, testInfo, '登录页');
          });

          test('商品图库：切换第二张图片并返回第一张', async ({ page }, testInfo) => {
            await visit(page, '/product/cosmos-bear-music-lollipop-gift-box/6gBNTC');
            const gallery = page.getByRole('region', { name: 'Product images', exact: true });
            await page.getByRole('button', { name: 'View image 2', exact: true }).click();
            await expect.poll(() => gallery.evaluate(el => el.scrollLeft / el.clientWidth)).toBeGreaterThan(0.8);
            const secondImage = gallery.locator('img').nth(1);
            await expect.poll(() => secondImage.evaluate(img => img.complete && img.naturalWidth > 0)).toBe(true);
