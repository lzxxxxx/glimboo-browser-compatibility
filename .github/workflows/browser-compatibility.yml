            scenario.quantityGate = new Promise(resolve => { release = resolve; });
            await page.getByRole('button', { name: 'Increase quantity', exact: true }).click();
            try { await expect(checkoutButton(page)).toBeDisabled(); } finally { release(); scenario.quantityGate = null; }
            await expect(quantity).toHaveValue('3');
            await page.getByRole('button', { name: 'Decrease quantity', exact: true }).click();
            await expect(quantity).toHaveValue('2');
            await page.reload({ waitUntil: 'domcontentloaded' });
