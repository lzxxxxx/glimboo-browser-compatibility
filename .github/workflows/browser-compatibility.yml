          import { test, expect, testAddress, openPurchasePage, capturePurchase } from './purchase-fixtures.mjs';

          const checkoutButton = page => page.getByRole('button', { name: /^Checkout\(/ }).filter({ visible: true });
          const addressDialog = page => page.getByRole('dialog', { name: 'Shipping Address', exact: true });
          const placeOrderButton = page => page.getByRole('button', { name: 'PLACE ORDER', exact: true }).filter({ visible: true });
          const writeRequests = (scenario, path) => scenario.requests.filter(r => r.path === path && r.method === 'POST');

          async function openCheckout(page) {
            await openPurchasePage(page, '/checkout');
            await expect(page.getByRole('heading', { name: 'Payment Method', exact: true })).toBeVisible();
          }

          async function openAddress(page) {
            await openCheckout(page);
            await page.getByRole('button', { name: 'Add Shipping Address', exact: true }).click();
            await expect(addressDialog(page)).toBeInViewport();
            return addressDialog(page);
          }

          async function fillAddress(page, overrides = {}) {
            const values = { firstname: 'Browser', lastname: 'Test', street: '123 Compatibility Lane',
              street2: 'Suite 2', city: 'Austin', postcode: '78701', telephone: '2025550123', ...overrides };
            for (const [field, value] of Object.entries(values)) await page.locator('#acct-addr-' + field).fill(value);
            await page.locator('#acct-addr-region').selectOption('43');
          }

          test('购物车：有商品时展示价格、数量和结算入口', async ({ page }, testInfo) => {
            await openPurchasePage(page, '/cart');
            await expect(page.getByRole('textbox', { name: 'Quantity', exact: true })).toHaveValue('2');
            await expect(checkoutButton(page)).toBeEnabled();
            await expect(page.locator('main')).toContainText('$39.98');
            await capturePurchase(page, testInfo, '有商品购物车');
          });

          test('购物车：增减数量、请求期间禁用结算、刷新保留', async ({ page, scenario }, testInfo) => {
            await openPurchasePage(page, '/cart');
