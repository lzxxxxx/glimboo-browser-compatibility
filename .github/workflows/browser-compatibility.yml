            { label: '万圣节棒棒糖详情', path: '/product/halloween-series-handcrafted-3d-art-lollipops/EGhA8F', group: '商品详情' },
            { label: '圣诞棉花糖详情', path: '/product/large-xmas-series-3d-creative-marshmallows/Epqp7e', group: '商品详情' },
            { label: '品牌介绍', path: '/about', group: '品牌与政策' },
