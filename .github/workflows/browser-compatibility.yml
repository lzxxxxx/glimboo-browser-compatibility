          test('新增地址：保存成功自动用于 checkout，刷新保留', async ({ page, scenario }, testInfo) => {
            const dialog = await openAddress(page);
            await fillAddress(page);
            await dialog.getByRole('button', { name: 'Save Address', exact: true }).click();
            await expect(dialog).not.toBeInViewport();
            await expect(page.locator('main')).toContainText('123 Compatibility Lane, Suite 2');
            await expect(placeOrderButton(page)).toBeEnabled();
            expect(writeRequests(scenario, '/api/customer/address')[0].body).toMatchObject({
              firstname: 'Browser', telephone: '2025550123', region_id: 43, default_shipping: true,
            });
            expect(writeRequests(scenario, '/api/checkout/address')[0].body).toEqual({ address_id: 7001 });
            await page.reload({ waitUntil: 'domcontentloaded' });
            await expect(page.locator('main')).toContainText('123 Compatibility Lane, Suite 2');
            await capturePurchase(page, testInfo, '地址保存后结算');
          });

          test('新增地址：接口字段错误显示在弹窗且保留输入', async ({ page, scenario }, testInfo) => {
            scenario.rejectAddress = true;
            const dialog = await openAddress(page);
            await fillAddress(page, { street: 'P.O. Box 123' });
            await dialog.getByRole('button', { name: 'Save Address', exact: true }).click();
            await expect(dialog.getByText('P.O. boxes are not supported', { exact: true })).toBeVisible();
            await expect(page.locator('#acct-addr-street')).toHaveValue('P.O. Box 123');
            await expect(placeOrderButton(page)).toBeDisabled();
            await dialog.locator('form').evaluate(el => { el.scrollTop = 0; });
            await capturePurchase(page, testInfo, '地址服务端校验', dialog);
          });

          test('选择地址：checkout 跳转地址簿并应用另一地址', async ({ page, scenario }, testInfo) => {
            scenario.addresses = [{ ...testAddress }, { ...testAddress, id: 7002, street: ['456 Browser Avenue'], default_shipping: false, default_billing: false }];
            scenario.selectedAddressId = 7001;
            await openCheckout(page);
            await page.getByRole('button', { name: 'Change', exact: true }).click();
            await expect(page).toHaveURL(/\/account\/addresses\?select=1&selectedId=7001/);
            await expect(page.getByText('Currently used', { exact: true })).toBeVisible();
            await capturePurchase(page, testInfo, '结算地址选择');
            await page.getByRole('button', { name: 'Use for this order', exact: true }).click();
            await expect(page).toHaveURL(/\/checkout$/);
            await expect(page.locator('main')).toContainText('456 Browser Avenue');
            expect(writeRequests(scenario, '/api/checkout/address').at(-1).body).toEqual({ address_id: 7002 });
          });

          test('结算商品：打开和关闭商品清单弹窗', async ({ page }, testInfo) => {
            await openCheckout(page);
            await page.getByRole('button', { name: 'View 2 Items', exact: true }).click();
            const dialog = page.getByRole('dialog', { name: 'Cart Items(2)', exact: true });
            await expect(dialog).toBeInViewport();
            await expect(dialog).toContainText('COSMOS BEAR Compatibility Test Item');
            await capturePurchase(page, testInfo, '结算商品弹窗', dialog);
            await dialog.getByRole('button', { name: 'Close cart items', exact: true }).click();
            await expect(dialog).not.toBeInViewport();
          });

          test('结算优惠券：错误码提示、应用、移除及金额更新', async ({ page }, testInfo) => {
            await openCheckout(page);
            const input = page.getByRole('textbox', { name: 'Coupon code', exact: true });
            await input.fill('INVALID');
            await page.getByRole('button', { name: 'APPLY', exact: true }).click();
            await expect(page.getByText('Invalid coupon code', { exact: true })).toBeVisible();
            await input.fill('TEST5');
            await input.press('Enter');
            await expect(page.getByRole('button', { name: 'Remove coupon', exact: true })).toBeVisible();
            await expect(page.locator('main')).toContainText('$34.98');
            await page.getByRole('button', { name: 'Remove coupon', exact: true }).click();
            await expect(input).toBeVisible();
            await expect(page.locator('main')).toContainText('$39.98');
            await capturePurchase(page, testInfo, '优惠券应用与移除');
          });

          test('结算优惠券：列表弹窗禁用失效券并可选择有效券', async ({ page }, testInfo) => {
            await openCheckout(page);
            await page.getByRole('button', { name: 'My Coupons (1)', exact: true }).click();
            const dialog = page.getByRole('dialog', { name: 'My Coupons', exact: true });
            await expect(dialog.getByRole('button', { name: /Expired test coupon/ })).toBeDisabled();
            await capturePurchase(page, testInfo, '结算优惠券弹窗', dialog);
            await dialog.getByRole('button', { name: /Compatibility test coupon/ }).click();
            if (page.viewportSize().width >= 1024) await expect(dialog).toHaveCSS('opacity', '0');
            else await expect(dialog).not.toBeInViewport();
            await expect(page.getByRole('button', { name: 'Remove coupon', exact: true })).toBeVisible();
            await page.getByRole('button', { name: 'Remove coupon', exact: true }).click();
            await expect(page.getByRole('textbox', { name: 'Coupon code', exact: true })).toBeVisible();
          });

          test('支付方式：信用卡与 PayPal 切换，不创建订单', async ({ page, scenario }, testInfo) => {
            scenario.addresses = [{ ...testAddress }]; scenario.selectedAddressId = 7001;
            await openCheckout(page);
            const card = page.locator('input[name="payment"][value="stripe_card"]');
            const paypal = page.locator('input[name="payment"][value="paypal_express"]');
            await page.locator('label').filter({ has: card }).click();
            await expect(card).toBeChecked();
            await expect.poll(() => scenario.payment).toBe('stripe_card');
            await page.locator('label').filter({ has: paypal }).click();
            await expect(paypal).toBeChecked();
            await expect.poll(() => scenario.payment).toBe('paypal_express');
            await expect(placeOrderButton(page)).toBeEnabled();
            await capturePurchase(page, testInfo, '结算支付方式');
          });
          GLIMBOO_COMPAT_FILE_EOF
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.install }}
      - name: Run compatibility tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload report, screenshots and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: compatibility-${{ matrix.project }}-${{ runner.os }}
          path: scratchpad/browser-compatibility/
          retention-days: 1
          if-no-files-found: warn
