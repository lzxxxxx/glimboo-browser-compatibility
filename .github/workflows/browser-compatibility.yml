              "report": "playwright show-report ../../scratchpad/browser-compatibility/report"
            },
            "devDependencies": {
              "@playwright/test": "1.60.0"
            }
          }
          GLIMBOO_COMPAT_FILE_EOF
          cat > 'package-lock.json' <<'GLIMBOO_COMPAT_FILE_EOF'
