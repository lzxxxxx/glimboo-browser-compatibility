# 自动生成：修改 tools/browser-compatibility 后运行 node scripts/export-browser-compatibility.mjs。
# 此文件自带全部测试代码，可以单独放进一个公开 GitHub 仓库。
name: Website browser compatibility
run-name: Browser compatibility — ${{ inputs.base_url || 'https://www.glimboo.com' }}

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Website URL
        required: true
        default: https://www.glimboo.com
        type: string

permissions:
  contents: read

concurrency:
  group: browser-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    # 只在公开仓库运行，使用免费的标准托管运行器。
    if: github.event.repository.private == false
    name: ${{ matrix.project }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { project: chrome, os: ubuntu-24.04, install: chrome }
          - { project: edge, os: windows-2022, install: msedge }
          - { project: firefox, os: ubuntu-24.04, install: firefox }
          - { project: webkit, os: macos-15, install: webkit }
          - { project: mobile-chrome, os: ubuntu-24.04, install: chromium }
          - { project: mobile-webkit, os: macos-15, install: webkit }
    env:
      COMPAT_BASE_URL: ${{ inputs.base_url }}
      COMPAT_OUTPUT_DIR: ${{ github.workspace }}/scratchpad/browser-compatibility
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare standalone tests
        run: |
          cat > 'package.json' <<'GLIMBOO_COMPAT_FILE_EOF'
